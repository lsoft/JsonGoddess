# Сборка и тесты.
#
# Windows, а не ubuntu, по одной причине: тесты идут в том числе под net472,
# и это не про .NET Framework как таковой - net472 единственный способ реально
# исполнить netstandard2.0-ассеты Common и Components, то есть #else-ветки
# горячего кода. На Linux эта треть тестов просто не запустилась бы, а
# расхождение там уже было: "R" на .NET Framework не переживает round-trip,
# и поймал это именно net472-прогон.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink кладёт в символы ссылку на коммит; без полной истории
          # она получается неверной
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore JsonGoddess.slnx

      - name: Build
        run: dotnet build JsonGoddess.slnx -c Release --no-restore

      # Две разные проверки, и подменять одну другой нельзя. Здесь -
      # порождённый код, исполняемый на трёх таргетах: он обязан дать тот же
      # документ, что System.Text.Json, и прочесть его так же.
      - name: Test
        run: dotnet test JsonGoddess.Tests/JsonGoddess.Tests.csproj -c Release --no-build

      # А здесь - сам генератор: текст, который он печатает, отказы, которые он
      # выдаёт, и обе половины инкрементальности. Round-trip ничего из этого не
      # заметит: выбор формы диспетчера и отсутствие ветки на разделители
      # проявляются только в скорости.
      - name: Generator tests
        run: dotnet test JsonGoddess.GeneratorTests/JsonGoddess.GeneratorTests.csproj -c Release --no-build

      # Перехват вызовов фасада целиком: здесь он, в отличие от JsonGoddess.Tests,
      # включён. Проект собирался и раньше, но не запускался - то есть
      # проверялось, что сгенерированный перехват компилируется, и не
      # проверялось, что он работает.
      - name: Compat tests
        run: dotnet test JsonGoddess.CompatTests/JsonGoddess.CompatTests.csproj -c Release --no-build

      # Третий прогон тех же тестов под чужой культурой.
      #
      # Заведён по случаю. Сообщение об отказе эталон склеивает разделителем
      # текущей культуры интерфейса, порождённый код держал его константой
      # "; ", и верно это было ровно под ru-RU - культурой машины, на которой
      # писалось. Раннер работает под en-US, и падение здесь было первым и
      # единственным признаком. Симметричная ошибка - написанная под en-US и
      # неверная в остальном мире - этим раннером не ловилась бы вовсе.
      #
      # tr-TR выбрана не наугад: это единственная культура, в которой
      # 'I'.ToLower() даёт 'ı', а 'i'.ToUpper() - 'İ', то есть единственная,
      # ломающая политики именования. ar-SA добавлена ради другого календаря,
      # других цифр и метки направления письма перед знаком минуса.
      - name: Test under a foreign culture
        env:
          JSONGODDESS_TEST_CULTURE: tr-TR
        run: |
          dotnet test JsonGoddess.Tests/JsonGoddess.Tests.csproj -c Release --no-build
          dotnet test JsonGoddess.GeneratorTests/JsonGoddess.GeneratorTests.csproj -c Release --no-build
          dotnet test JsonGoddess.CompatTests/JsonGoddess.CompatTests.csproj -c Release --no-build

      - name: Test under a right-to-left culture
        env:
          JSONGODDESS_TEST_CULTURE: ar-SA
        run: dotnet test JsonGoddess.Tests/JsonGoddess.Tests.csproj -c Release --no-build

      # Не замер, а проверка: все участники бенчмарка обязаны выдавать один и
      # тот же документ. Расхождение здесь означает, что сравнивать нечего, и
      # узнать об этом надо до, а не после получаса BenchmarkDotNet.
      - name: Benchmark participants agree
        run: dotnet run -c Release -f net10.0 --project JsonGoddess.PerformanceTests --no-build -- --verify

      # То же самое для лестницы, и здесь у проверки есть вторая работа.
      # Документы на всех ступенях она сверяет так же, но главное - она
      # поднимает настоящий ASP.NET Core и требует, чтобы мост взялся за Order
      # на ВСЕХ ЧЕТЫРЁХ раковинах опций, которые строит фреймворк: настроенной,
      # той, которой пишется ответ (там подменённый энкодер), той, которой
      # читается тело, и раковине minimal API. Плюс POST через весь конвейер:
      # совпал ли разбор, проверяется ответом контроллера, а не осмотром опций.
      #
      # Разъедься однажды JsonSerializerDefaults.Web с нашим веб-профилем -
      # мост молча отступит, всё останется зелёным и правильным, и только
      # медленным. Молчаливого исхода здесь быть не должно.
      #
      # Свойства JsonGoddessCompatWeb проект не ставит: веб-профиль обязан
      # включаться сам, по факту ссылки на ASP.NET Core, и этот шаг проверяет
      # заодно и это.
      - name: The staircase agrees, and the bridge still reaches ASP.NET
        run: dotnet run -c Release --project JsonGoddess.WebPerformanceTests --no-build -- --verify

      # Прототип фазы 10: разбор по кускам с переигрыванием элемента.
      #
      # Он здесь не ради скорости, а ради двух утверждений, которые иначе
      # проверить нечем: документ читается одинаково при ЛЮБОЙ нарезке, вплоть
      # до подачи по одному байту с сегментом на байт, и обрыв на каждом
      # смещении кончается отказом, а не молча принятым результатом. Плюс
      # настоящий ASP.NET: свой входной форматтер обязан давать тот же ответ и
      # тот же код отказа, что штатный.
      #
      # Обе находки прототипа были именно такими - тихими: разбор шёл дальше и
      # ломался далеко от места, где соврали.
      - name: The streaming prototype reads the same on any split
        run: dotnet run -c Release --project JsonGoddess.StreamingPrototype --no-build
